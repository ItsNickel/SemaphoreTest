---
- name: Read-only OpenStack test
  hosts: local
  gather_facts: false

  tasks:
    - name: Get OpenStack server information
      openstack.cloud.server_info:
        cloud: openstack
      register: server_info

    - name: Show discovered servers
      ansible.builtin.debug:
        msg: "{{ server_info.servers | map(attribute='name') | list }}"